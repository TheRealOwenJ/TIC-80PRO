name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: nesbox/TIC-80
  BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure remotes
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://x-access-token:${GH_TOKEN}@github.com/${UPSTREAM_REPO}.git"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Fetch upstream
        run: |
          git fetch --prune upstream main

      - name: Check for upstream changes
        id: changes
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          echo "Local:    $LOCAL"
          echo "Upstream: $UPSTREAM"

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has changes."
          fi

      - name: Merge upstream
        if: steps.changes.outputs.changed == 'true'
        run: |
          set +e

          git merge upstream/main --no-edit
          MERGE_STATUS=$?

          if [ "$MERGE_STATUS" -eq 0 ]; then
            exit 0
          fi

          echo "Merge conflict detected."

          CONFLICTS=$(git diff --name-only --diff-filter=U)

          echo "Conflicting files:"
          echo "$CONFLICTS"

          NON_WORKFLOW_CONFLICTS=$(echo "$CONFLICTS" | grep -v '^\.github/workflows/' || true)

          if [ -n "$NON_WORKFLOW_CONFLICTS" ]; then
            echo "Unexpected conflicts outside .github/workflows:"
            echo "$NON_WORKFLOW_CONFLICTS"

            git merge --abort
            exit 1
          fi

          echo "Only workflow files conflict."
          echo "Keeping fork versions of all .github/workflows files."

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "Keeping fork version: $file"

            git checkout --ours -- "$file"
            git add "$file"
          done <<< "$CONFLICTS"

          git commit --no-edit

      - name: Verify merge
        if: steps.changes.outputs.changed == 'true'
        run: |
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          echo "Merge completed successfully."

      - name: Get synced commit
        if: steps.changes.outputs.changed == 'true'
        id: commit
        run: |
          COMMIT=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)

          echo "Synced commit: $COMMIT"
          echo "Short commit:  $SHORT"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - name: Record sync time
        if: steps.changes.outputs.changed == 'true'
        id: time
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Push synced main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "HEAD:${BRANCH}"

      - name: Check if release exists
        if: steps.changes.outputs.changed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          TAG="upstream-${{ steps.commit.outputs.short }}"

          if gh release view "$TAG" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Find build workflow run
        if: steps.changes.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
        id: build
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          START_TIME: ${{ steps.time.outputs.timestamp }}
        run: |
          echo "Waiting for build workflow to appear..."

          RUN_ID=""

          for i in {1..60}; do
            RUN_ID=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow build.yml \
              --branch "${BRANCH}" \
              --limit 20 \
              --json databaseId,status,createdAt \
              --jq '
                .[]
                | select(.createdAt >= "'"$START_TIME"'")
                | .databaseId
              ' | head -n 1)

            if [ -n "$RUN_ID" ]; then
              echo "Found build workflow run: $RUN_ID"
              break
            fi

            echo "Build run not visible yet. Attempt $i/60..."
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find the triggered build workflow."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for build workflow
        if: steps.changes.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          gh run watch \
            "${{ steps.build.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --exit-status

      - name: Download all build artifacts
        if: steps.changes.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          gh run download \
            "${{ steps.build.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir artifacts

          echo "Downloaded artifacts:"
          find artifacts -type f -print

          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "No build artifacts were downloaded."
            exit 1
          fi

      - name: Package artifacts
        if: steps.changes.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
        run: |
          mkdir -p release

          find artifacts -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
            name=$(basename "$dir")

            echo "Packaging $name..."

            (
              cd "$dir"
              zip -r "../../release/${name}.zip" .
            )
          done

          echo "Release files:"
          ls -lh release

      - name: Create release
        if: steps.changes.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          SHORT: ${{ steps.commit.outputs.short }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$COMMIT" \
            --title "TIC-80 PRO upstream-$SHORT" \
            --notes "TIC-80 PRO build from upstream commit:

          Commit: $COMMIT
          Upstream: https://github.com/${UPSTREAM_REPO}/commit/$COMMIT

          This release was automatically built from the latest synced upstream commit."

      - name: Summary
        if: always()
        run: |
          echo "## Upstream Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: \`${UPSTREAM_REPO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream changed: \`${{ steps.changes.outputs.changed || 'unknown' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.commit.outputs.commit || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ steps.release.outputs.tag || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"

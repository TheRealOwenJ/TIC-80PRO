name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/nesbox/TIC-80.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream
        run: |
          git merge upstream/main --no-edit || {
            git checkout --ours .github/workflows
            git add .github/workflows
            git commit --no-edit
          }

      - name: Push
        run: git push origin main

      - name: Get latest upstream release
        id: upstream_release
        run: |
          release=$(curl -fsSL https://api.github.com/repos/nesbox/TIC-80/releases/latest)

          echo "tag=$(echo "$release" | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$release" | jq -r '.name')" >> "$GITHUB_OUTPUT"

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$release" | jq -r '.body' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          if gh release view "${{ steps.upstream_release.outputs.tag }}" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build workflow
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main

      - name: Wait for build workflow
        if: steps.check_release.outputs.exists == 'false'
        id: build
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          echo "Waiting for build workflow..."

          for i in {1..60}; do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow build.yml \
              --branch main \
              --limit 1 \
              --json databaseId,status \
              --jq '.[0] | select(.status != "completed") | .databaseId')

            if [ -n "$RUN_ID" ]; then
              echo "Found build: $RUN_ID"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            fi

            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find build workflow run"
            exit 1
          fi

          gh run watch "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --exit-status

      - name: Download build artifacts
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          mkdir artifacts

          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name tic80-windows-pro \
            --dir artifacts

      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          gh release create "${{ steps.upstream_release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "TIC-80 PRO ${{ steps.upstream_release.outputs.tag }}" \
            --notes "${{ steps.upstream_release.outputs.body }}" \
            artifacts/*
